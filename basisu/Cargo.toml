[package]
name = "basisu"
description = "A bit-exact pure-Rust Basis Universal texture transcoder (.ktx2 and .basis)."
version = "0.1.0"
# The `zstd` default feature pulls ruzstd 0.8, whose own MSRV is 1.87; without
# that feature the crate still builds on 1.73.
rust-version = "1.87"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/marcogomez/basisu"
readme = "../README.md"
categories = ["multimedia::images", "rendering::data-formats"]
keywords = ["basis", "ktx2", "texture", "transcode", "gpu"]
# The tests and benches depend on repo-level files outside this package
# (corpus/, goldens/), so they cannot run from the published crate; they run
# from the repository checkout instead.
exclude = ["tests/", "benches/"]

# The ergonomic crate path: `use basisu::...`.
[lib]
name = "basisu"
path = "src/lib.rs"

[features]
default = [
    "std",
    "zstd",
    "astc-ldr",
    "xuastc",
    "hdr",
    "bc",
    "etc",
    "eac",
    "astc",
    "pvrtc1",
    "pvrtc2",
    "atc",
    "fxt1",
    "packed",
]
# Disabling `std` makes the crate `#![no_std]` (it still requires `alloc`).
std = []
# `ss=2` (Zstandard-supercompressed) KTX2 levels. Pure-Rust inflate; drop it for
# a leaner build (such levels then error with `Error::ZstdRequired`). It uses
# `ruzstd`'s `std::io::Read`, so it implies `std`.
zstd = ["dep:ruzstd", "std"]
# Float sqrt/round for no_std builds (in std, not core). Enable for `no_std`:
# `--no-default-features --features libm`.
libm = ["dep:libm"]
# Codec features. ETC1S and UASTC LDR sources and the RGBA32 target are always
# compiled; everything else is a feature so a consumer that transcodes to a
# known target set can leave the other codecs (and their lookup tables, tens
# of kilobytes each) out of its binary. A (source, target) pair whose feature
# is off reports false from `is_format_supported` / `Transcoder::supports` and
# fails a transcode with `Error::Unsupported`. Only the dispatch arms are
# gated; the codec modules themselves stay compiled and unreachable code is
# dropped by the final link.
#
# Sources beyond ETC1S / UASTC LDR:
astc-ldr = []
xuastc = ["astc-ldr"]
hdr = []
# Target families:
bc = []
etc = []
eac = []
astc = []
pvrtc1 = []
pvrtc2 = []
atc = []
fxt1 = []
packed = []

[dependencies]
ruzstd = { version = "0.8", optional = true, default-features = false }
libm = { version = "0.2", optional = true }

# Only no-native-atomic targets (Cortex-M0/M0+, AVR) need portable-atomic; every
# other target uses core atomics in `once` and this is not pulled in.
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { version = "1", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
sha2 = "0.10"

# Runtime wasm tests (tests/wasm.rs). Its bundled wasm-bindgen must match the
# installed `wasm-bindgen-test-runner`: 0.3.68 pairs with wasm-bindgen 0.2.118.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.68"

[[bench]]
name = "transcode"
harness = false
