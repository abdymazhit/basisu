# Cortex-M0 (no native atomics) harness: proves the crate runs on a target where
# `once::OnceBox` uses portable-atomic + a critical section instead of core
# atomics. microbit has only 16K RAM, too small for a transcode working set, so
# this exercises exactly what the M0 path changes: the CAS one-shot init. Own
# workspace.
[package]
name = "qemu-check-m0"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
basisu = { path = "../basisu", default-features = false, features = ["libm"] }
cortex-m-rt = "0.7"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
embedded-alloc = "0.5"
# Gives basisu's portable-atomic (pulled on this no-atomic target) a
# critical-section-based CAS implementation.
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[profile.release]
opt-level = "s"
lto = true
